name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 签名钥匙 = 仓内 debug.keystore（2026-11-15 钉死：曾因 actions/cache 7天过期
      # 导致每次缓存失效就换钥匙 → 新旧包签名不兼容、无法覆盖安装）。仅文件缺失时兜底生成。
      - if: ${{ !hashFiles('debug.keystore') }}
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: build
        run: gradle assembleDebug --parallel --build-cache --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lite-widget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
