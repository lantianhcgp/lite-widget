name: build
on: push
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - id: ks
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: debug-keystore-v1

      - if: steps.ks.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: build
        run: gradle assembleDebug --parallel --build-cache --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lite-widget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: publish release apk
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VER" ]; then echo "::error::versionName 未找到"; exit 1; fi
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if [ -z "$APK" ]; then echo "::error::APK 未找到"; exit 1; fi
          ASSET="lite-widget-v${VER}.apk"
          TAG="v${VER}"
          cp "$APK" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            echo "已覆盖上传 $ASSET -> release $TAG"
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --generate-notes
            echo "已创建 release $TAG 并上传 $ASSET"
          fi
