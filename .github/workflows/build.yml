name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 签名钥匙 = 仓内 debug.keystore（2026-11-15 钉死：曾因 actions/cache 7天过期
      # 导致每次缓存失效就换钥匙 → 新旧包签名不兼容、无法覆盖安装）。仅文件缺失时兜底生成。
      - if: ${{ !hashFiles('debug.keystore') }}
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-export
          path: debug.keystore
          if-no-files-found: error

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python contract and generator checks
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/generate_kanban_template.py --check

      - name: build and Android Canvas tests
        run: gradle assembleDebug testDebugUnitTest --parallel --build-cache --no-daemon

      - name: verify real Canvas pixels
        run: python3 scripts/verify_kanban_pixels.py app/build/kanban-preview --output app/build/kanban-preview/pixel-checks.json

      - name: upload tests and real Canvas previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanban-tests-and-preview
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/kanban-preview/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: lite-widget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
